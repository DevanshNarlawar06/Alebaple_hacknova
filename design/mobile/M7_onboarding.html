<!DOCTYPE html>

<html class="h-full bg-white" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Beacon — Onboarding</title>
<!-- Google Fonts: Inter & JetBrains Mono -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "outline-variant": "#c6c6c6",
            "error-container": "#ffdad6",
            "surface-bright": "#fbf9f9",
            "primary-fixed-dim": "#474746",
            "primary-container": "#3c3b3b",
            "on-primary-fixed": "#ffffff",
            "surface-variant": "#e3e2e2",
            "outline": "#777777",
            "on-tertiary-fixed-variant": "#e2e2e2",
            "on-error-container": "#410002",
            "primary": "#000000",
            "on-surface": "#1b1c1c",
            "error": "#ba1a1a",
            "surface-container-highest": "#e3e2e2",
            "on-primary-container": "#ffffff",
            "on-surface-variant": "#474747",
            "surface-container": "#efeded",
            "secondary-fixed": "#c6c6c6",
            "on-secondary": "#ffffff",
            "on-error": "#ffffff",
            "surface-tint": "#5f5e5e",
            "secondary-container": "#d4d4d4",
            "on-tertiary-container": "#ffffff",
            "surface-container-high": "#e9e8e7",
            "background": "#fbf9f9",
            "secondary-fixed-dim": "#ababab",
            "on-primary-fixed-variant": "#e5e2e1",
            "surface": "#fbf9f9",
            "primary-fixed": "#5f5e5e",
            "on-secondary-fixed-variant": "#3b3b3b",
            "on-secondary-fixed": "#1b1b1b",
            "inverse-on-surface": "#f2f0f0",
            "tertiary-fixed-dim": "#474747",
            "tertiary": "#3b3b3b",
            "on-tertiary-fixed": "#ffffff",
            "surface-dim": "#dbdad9",
            "secondary": "#5e5e5e",
            "tertiary-fixed": "#5e5e5e",
            "tertiary-container": "#747474",
            "inverse-primary": "#c8c6c5",
            "on-secondary-container": "#1b1b1b",
            "on-tertiary": "#e2e2e2",
            "inverse-surface": "#303031",
            "surface-container-low": "#f5f3f3",
            "surface-container-lowest": "#ffffff",
            "on-primary": "#e5e2e1",
            "on-background": "#1b1c1c"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Inter", "sans-serif"],
            "display": ["Inter", "sans-serif"],
            "body": ["Inter", "sans-serif"],
            "label": ["Inter", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>
<style>
    /* Strictly conform to near-monochrome minimal guidelines */
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #FAFAFA;
      color: #171717;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
    }
    input::placeholder {
      color: #A3A3A3;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-full flex justify-center items-center p-0 md:p-6 bg-[#FAFAFA]">
<!-- Mobile Viewport Container (Target 390x844px) -->
<main class="w-full max-w-[390px] h-full min-h-[844px] bg-white flex flex-col justify-between relative border-0 md:border md:border-[#E5E5E5] md:rounded-xl overflow-hidden shadow-none">
<!-- Top Shell / TopAppBar Header -->
<header class="w-full h-14 px-6 flex justify-between items-center border-b border-[#E5E5E5] bg-white z-10 select-none">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[20px] text-[#525252]" data-icon="adjust">adjust</span>
<span class="font-headline text-base font-semibold tracking-tight text-[#171717]">Beacon</span>
</div>
<button class="text-sm font-normal text-[#525252] hover:text-[#171717] transition-colors focus:outline-none" type="button">
        Skip
      </button>
</header>
<!-- Main Content Canvas -->
<section class="flex-1 px-6 pt-8 pb-4 flex flex-col">
<!-- Icon Indicator -->
<div class="w-10 h-10 rounded-lg flex items-center justify-center border border-[#E5E5E5] bg-white mb-6">
<svg class="w-5 h-5 text-[#525252]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
<circle cx="12" cy="10" r="3"></circle>
</svg>
</div>
<!-- Typography Header -->
<h1 class="text-[28px] font-semibold text-[#171717] tracking-tight leading-tight">
        Choose your area
      </h1>
<p class="text-sm text-[#525252] mt-2 leading-relaxed">
        We'll only show alerts and checked reports near this place.
      </p>
<!-- Input Field -->
<div class="mt-6">
<label class="sr-only" for="search-input">Search city or area</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#525252]">
<svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="11" cy="11" r="8"></circle>
<path d="m21 21-4.3-4.3"></path>
</svg>
</div>
<input class="w-full h-12 pl-10 pr-3.5 bg-white border border-[#E5E5E5] rounded-lg text-sm text-[#171717] focus:border-[#0F766E] focus:ring-0 outline-none transition-colors" id="search-input" placeholder="Search city or area" type="text" value="Pune"/>
</div>
</div>
<!-- Secondary Geolocation Button -->
<button class="w-full h-12 mt-3 bg-white border border-[#E5E5E5] rounded-lg text-[#171717] font-medium text-sm flex items-center justify-center gap-2 hover:bg-[#FAFAFA] active:bg-[#F5F5F5] transition-colors focus:outline-none" type="button">
<svg class="w-4 h-4 text-[#525252]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
<line x1="22" x2="18" y1="12" y2="12"></line>
<line x1="6" x2="2" y1="12" y2="12"></line>
<line x1="12" x2="12" y1="6" y2="2"></line>
<line x1="12" x2="12" y1="22" y2="18"></line>
</svg>
<span>Use my location</span>
</button>
<!-- Suggestion List -->
<div class="mt-6 bg-white border border-[#E5E5E5] rounded-lg overflow-hidden divide-y divide-[#E5E5E5]">
<!-- Row 1: Selected Area -->
<div class="w-full py-3 px-4 flex items-center justify-between hover:bg-[#FAFAFA] cursor-pointer transition-colors bg-[#FAFAFA]">
<div class="flex items-center gap-3">
<svg class="w-4 h-4 text-[#525252] flex-shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
<circle cx="12" cy="10" r="3"></circle>
</svg>
<div class="text-left">
<span class="text-sm font-medium text-[#171717]">Kothrud, Pune</span>
<span class="block text-xs text-[#A3A3A3]">Maharashtra, India</span>
</div>
</div>
<!-- Clean status indicator / Selection pill -->
<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full border border-[#E5E5E5] bg-white text-[11px] font-mono text-[#525252]">
<span class="w-1.5 h-1.5 rounded-full bg-[#171717]"></span>
            Selected
          </span>
</div>
<!-- Row 2: Secondary Area -->
<div class="w-full py-3 px-4 flex items-center justify-between hover:bg-[#FAFAFA] cursor-pointer transition-colors">
<div class="flex items-center gap-3">
<svg class="w-4 h-4 text-[#525252] flex-shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
<circle cx="12" cy="10" r="3"></circle>
</svg>
<div class="text-left">
<span class="text-sm font-normal text-[#171717]">Shivajinagar, Pune</span>
<span class="block text-xs text-[#A3A3A3]">Maharashtra, India</span>
</div>
</div>
<svg class="w-4 h-4 text-[#A3A3A3]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="m9 18 6-6-6-6"></path>
</svg>
</div>
</div>
<!-- Privacy Note -->
<div class="mt-5 flex items-center gap-2">
<svg class="w-3.5 h-3.5 text-[#A3A3A3] flex-shrink-0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect>
<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
</svg>
<span class="text-xs text-[#A3A3A3] tracking-normal">
          Your exact location stays on your phone.
        </span>
</div>
</section>
<!-- Bottom Navigation / Progress & Primary Action Anchor -->
<footer class="w-full bg-white border-t border-[#E5E5E5] px-6 pt-4 pb-8 space-y-4">
<!-- Progress Indicator Dots (Step 2 of 3) -->
<div aria-label="Step 2 of 3" class="flex items-center justify-center gap-2">
<!-- Step 1: Inactive -->
<span class="w-2 h-2 rounded-full bg-[#E5E5E5]"></span>
<!-- Step 2: Active -->
<span class="w-2 h-2 rounded-full bg-[#0F766E]"></span>
<!-- Step 3: Inactive -->
<span class="w-2 h-2 rounded-full bg-[#E5E5E5]"></span>
</div>
<!-- Primary Action -->
<button class="w-full h-12 bg-[#0F766E] text-white font-medium text-sm rounded-lg flex items-center justify-center hover:bg-[#115E59] active:scale-[0.99] transition-all focus:outline-none" type="button">
        Continue
      </button>
</footer>
</main>
</body></html>
